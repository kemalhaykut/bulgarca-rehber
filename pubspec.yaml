name: bulgarca_rehber
description: Bulgarca Rehber — Türkçe anlatımlı A1–A2 Bulgarca dilbilgisi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/web/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1A2836"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 24
